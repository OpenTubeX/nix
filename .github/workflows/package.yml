name: Build and update Nix packages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * *'
  repository_dispatch:
    types: [opentubex-release]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Published release tag (empty uses the latest release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.metadata.outputs.changed }}
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release updater
        run: python3 -m unittest discover -s scripts -v
      - name: Prepare release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ contains(fromJSON('["schedule", "repository_dispatch", "workflow_dispatch"]'), github.event_name) }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UPDATE" == true ]]; then
            args=()
            if [[ -n "$RELEASE_TAG" ]]; then
              args+=(--tag "$RELEASE_TAG")
            fi
            python3 scripts/update.py "${args[@]}"
          fi
          if git diff --quiet -- release.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release.json
          retention-days: 7

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Check flake and build package
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix fmt -- --check flake.nix package.nix
          nix flake check --no-build --all-systems
          nix build ".#packages.${SYSTEM}.opentubex" --print-build-logs
      - name: Verify bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          ELECTRON_RUN_AS_NODE=1 ./result/bin/opentubex -e '
            const expected = { Linux: "linux", Darwin: "darwin" }[require("node:os").type()];
            if (process.platform !== expected || !process.versions.electron) process.exit(1);
            console.log({ platform: process.platform, arch: process.arch, electron: process.versions.electron });
          '
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict result/Applications/OpenTubeX.app

  publish:
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.changed == 'true' &&
      contains(fromJSON('["schedule", "repository_dispatch", "workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
      - name: Publish verified release pin
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          content = Path("release.json").read_bytes()
          version = json.loads(content)["version"]
          request = {
              "query": "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"], "branchName": os.environ["DEFAULT_BRANCH"]},
                  "expectedHeadOid": os.environ["EXPECTED_HEAD"],
                  "message": {"headline": f"chore: update OpenTubeX to {version}"},
                  "fileChanges": {"additions": [{"path": "release.json", "contents": base64.b64encode(content).decode("ascii")}]},
              }},
          }
          Path("commit-request.json").write_text(json.dumps(request))
          PY
          # GitHub signs this commit. Refuse to publish if the tested revision changed.
          gh api graphql --input commit-request.json
